<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Smart Run</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  #game { touch-action: none; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #rotate { display: none; position: absolute; inset: 0; background: #101830; color: #fff;
    font: bold 18px sans-serif; align-items: center; justify-content: center; text-align: center; line-height: 1.8; }
  @media (orientation: portrait) { #rotate.on { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="400" height="224"></canvas>
<div id="rotate"><div>&#x1F4F1;&#x21BB;<br>端末を横向きにしてください<br><small>Please rotate to landscape</small></div></div>

</body>
</html>
