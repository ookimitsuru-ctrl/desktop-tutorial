name: Android Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: planetgrow-debug-apk
          path: app/build/outputs/apk/**/*.apk

  preview:
    # Android SDK なしで動く描画プレビュー (惑星の絵が壊れていないかの確認)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Render preview images
        working-directory: preview
        run: ../gradlew run --args="out 1 06:00 12:00 18:30 23:00"

      - name: Upload preview images
        uses: actions/upload-artifact@v4
        with:
          name: planet-preview
          path: preview/out/*.png
