    <ellipse cx="258" cy="262" rx="178" ry="40" fill="#14254f" opacity=".13"/>
    <!-- サスペンション -->
    <g stroke="#2f3338" stroke-width="5" stroke-linecap="round"><path d="M200 246 L166 190 M200 266 L166 322 M152 250 L166 190 M152 262 L166 322 M326 250 L358 192 M326 262 L358 320 M372 252 L358 192 M372 260 L358 320"/></g>
    <!-- フロントウイング -->
    <rect x="82" y="182" width="36" height="148" rx="3" fill="#14254f"/><rect x="90" y="182" width="12" height="148" fill="#2a4a9a"/>
    <rect x="78" y="176" width="44" height="8" rx="2" fill="#f47a1f"/><rect x="78" y="328" width="44" height="8" rx="2" fill="#f47a1f"/>
