    <rect x="228" y="222" width="12" height="8" rx="2" fill="#f47a1f"/><rect x="228" y="282" width="12" height="8" rx="2" fill="#f47a1f"/>
  </g>
  <!-- 下: simulator -->
  <text x="256" y="420" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic" font-size="68" text-anchor="middle" fill="#14254f" letter-spacing="1">simulator</text>
</svg>
