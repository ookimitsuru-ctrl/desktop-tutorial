  <!-- 下: simulator -->
  <text x="256" y="414" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic" font-size="64" text-anchor="middle" fill="#14254f" letter-spacing="1">simulator</text>
</svg>
