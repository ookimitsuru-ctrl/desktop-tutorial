    <rect x="406" y="206" width="32" height="100" rx="3" fill="#14254f"/><rect x="414" y="206" width="12" height="100" fill="#2a4a9a"/>
    <rect x="402" y="201" width="40" height="7" rx="2" fill="#f47a1f"/><rect x="402" y="304" width="40" height="7" rx="2" fill="#f47a1f"/>
    <rect x="402" y="248" width="8" height="16" fill="#14254f"/>
    <!-- タイヤ: フロントは細め、リアは太く大きい -->
    <g fill="#101113"><rect x="132" y="172" width="68" height="32" rx="9"/><rect x="132" y="308" width="68" height="32" rx="9"/><rect x="316" y="160" width="86" height="60" rx="11"/><rect x="316" y="292" width="86" height="60" rx="11"/></g>
    <g fill="#fff" opacity=".13"><rect x="139" y="177" width="54" height="9" rx="3"/><rect x="139" y="313" width="54" height="9" rx="3"/><rect x="324" y="166" width="70" height="14" rx="4"/><rect x="324" y="298" width="70" height="14" rx="4"/></g>
    <!-- サイドポンツーン (涙型) -->
    <path d="M236 216 Q292 212 340 230 L350 256 L340 282 Q292 300 236 296 Q218 256 236 216 Z" fill="#f47a1f"/>
    <path d="M250 230 L330 236 L330 248 L250 242 Z" fill="#14254f"/><path d="M250 270 L330 264 L330 276 L250 282 Z" fill="#14254f"/>
    <path d="M226 226 L240 228 L240 284 L226 286 Z" fill="#0c0d0f"/>
