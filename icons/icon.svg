<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f1e2"/><stop offset="1" stop-color="#eadfc6"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 上: Formula -->
  <text x="256" y="130" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic" font-size="78" text-anchor="middle" fill="#14254f" letter-spacing="1">Formula</text>
  <!-- 中: 左向きの車 (ノーズが左)。1990年前後のF1: 細身のボディ、大きなリアタイヤ、V字のサスペンション -->
