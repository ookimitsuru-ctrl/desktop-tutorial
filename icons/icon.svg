    <path d="M326 249 L404 251 L404 261 L326 263 Z" fill="#14254f"/>
    <ellipse cx="318" cy="256" rx="9" ry="13" fill="#0b0b0c"/>
    <!-- コックピット -->
    <ellipse cx="252" cy="256" rx="34" ry="17" fill="#0d0e10"/>
    <circle cx="260" cy="256" r="12" fill="#fff"/><rect x="258" y="244" width="6" height="24" fill="#14254f"/><path d="M253 249 Q246 256 253 263 Q258 260 258 256 Q258 252 253 249 Z" fill="#1a2030"/>
    <rect x="226" y="247" width="5" height="18" fill="#2b2b2b"/>
