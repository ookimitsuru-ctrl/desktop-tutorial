    <g fill="#fff" opacity=".13"><rect x="139" y="177" width="54" height="9" rx="3"/><rect x="139" y="313" width="54" height="9" rx="3"/><rect x="329" y="173" width="62" height="12" rx="4"/><rect x="329" y="299" width="62" height="12" rx="4"/></g>
    <!-- サイドポンツーン (涙型) -->
    <path d="M236 206 L300 206 Q322 210 350 240 L352 256 L350 272 Q322 302 300 306 L236 306 Q224 256 236 206 Z" fill="#f47a1f"/>
    <path d="M250 216 L312 218 L312 230 L250 228 Z" fill="#14254f"/><path d="M250 284 L312 282 L312 294 L250 296 Z" fill="#14254f"/>
    <path d="M226 212 L240 214 L240 298 L226 300 Z" fill="#0c0d0f"/>
