    <path d="M96 256 Q150 247 206 240 L262 234 L330 236 Q372 240 408 247 L408 265 Q372 272 330 276 L262 278 L206 272 Q150 265 96 256 Z" fill="#f47a1f"/>
    <path d="M96 256 Q150 247 206 240 L262 234 L330 236 Q372 240 408 247 L408 265 Q372 272 330 276 L262 278 L206 272 Q150 265 96 256 Z" fill="url(#shine)"/>
    <path d="M96 256 Q118 252 140 250 L140 262 Q118 260 96 256 Z" fill="#14254f"/>
